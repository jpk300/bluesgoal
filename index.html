<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>St. Louis Blues Goal Horn</title>
    <link rel="stylesheet" href="stylesheets/main.css">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

</head>
<body>
    <main class="page" aria-label="St. Louis Blues Goal Horn controls">
        <a class="settings-link settings-link--home" href="settings.html">Settings</a>
        <header class="hero">
            <img class="hero__image" src="./images/nhl_goal_logo.jpeg" alt="St. Louis Blues goal horn">
        </header>

        <section class="button-grid">
            <!-- Top row actions can be changed later by updating the href and image src values. -->
            <a class="control-button" href="goalhorn/_powerplay.php" aria-label="Power Play" data-action>
                <span class="control-button__inner">
                    <img src="./images/button_bluesgoal_powerplay.jpeg" alt="">
                </span>
            </a>

            <a class="control-button" href="goalhorn/_bluesgoal_winterclassic.php" aria-label="Winter Classic" data-action>
                <span class="control-button__inner">
                    <img src="./images/button_bluesgoal_winterclassic.jpeg" alt="">
                </span>
            </a>

            <a class="control-button" href="goalhorn/_bluesgoal_oldschool.php" aria-label="Old School" data-action>
                <span class="control-button__inner">
                    <img src="./images/button_bluesgoal_oldschool.jpeg" alt="">
                </span>
            </a>

            <a class="control-button" href="goalhorn/_marching_in_glenn.php" aria-label="Marching in Glenn" data-action>
                <span class="control-button__inner">
                    <img src="./images/button_bluesgoal_marching_in_glenn.jpeg" alt="">
                </span>
            </a>

            <div class="center-logo-tile" aria-hidden="true">
                <div class="center-logo-tile__inner">
                    <img src="./images/bluesgoal_logo.jpeg" alt="">
                </div>
            </div>

            <a class="control-button" href="goalhorn/_marching_in.php" aria-label="Marching in" data-action>
                <span class="control-button__inner">
                    <img src="./images/button_bluesgoal_marching_in_2017.jpeg" alt="">
                </span>
            </a>

            <a class="control-button control-button--wide" href="goalhorn/_volume_down.php" aria-label="Volume down" data-action>
                <span class="control-button__inner">
                    <img src="./images/button_volume_down.jpeg" alt="">
                </span>
            </a>

            <a class="control-button control-button--wide" href="goalhorn/_stop.php" aria-label="Stop" data-action>
                <span class="control-button__inner">
                    <img src="./images/button_stop.png" alt="">
                </span>
            </a>

            <a class="control-button control-button--wide" href="goalhorn/_volume_up.php" aria-label="Volume up" data-action>
                <span class="control-button__inner">
                    <img src="./images/button_volume_up.jpeg" alt="">
                </span>
            </a>
        </section>
    </main>

    <script>
        // Track which buttons are currently processing
        const processingButtons = new Set();

        // Fetch and display current status
        async function updateStatus() {
            try {
                const response = await fetch('goalhorn/_status.php', {
                    cache: 'no-store',
                    credentials: 'same-origin'
                });
                const data = await response.json();

                if (data.success && data.data) {
                    // Update volume display
                    if (data.data.volume !== undefined && data.data.volume !== null && data.data.volume !== 'unknown') {
                        updateVolumeDisplay(data.data.volume);
                    }

                    // Update audio playing status
                    updateAudioStatus(data.data.audio_playing);
                }

                return true;
            } catch (e) {
                console.error('Failed to get status:', e);
                return false;
            }
        }

        function updateVolumeDisplay(volume) {
            let display = document.getElementById('volume-display');
            if (!display) {
                display = document.createElement('div');
                display.id = 'volume-display';
                display.style.cssText = `
                    position: fixed;
                    bottom: 20px;
                    right: 20px;
                    background: rgba(0, 47, 135, 0.9);
                    color: #fcb514;
                    padding: 12px 18px;
                    border-radius: 8px;
                    font-weight: bold;
                    font-size: 14px;
                    border: 2px solid #fcb514;
                    z-index: 1000;
                `;
                document.body.appendChild(display);
            }
            display.textContent = `🔊 Volume: ${volume}%`;
        }

        function updateAudioStatus(isPlaying) {
            let indicator = document.getElementById('audio-indicator');
            if (!indicator) {
                indicator = document.createElement('div');
                indicator.id = 'audio-indicator';
                indicator.style.cssText = `
                    position: fixed;
                    top: 20px;
                    left: 20px;
                    width: 12px;
                    height: 12px;
                    border-radius: 50%;
                    background: #ccc;
                    z-index: 1000;
                    transition: background 0.3s;
                `;
                document.body.appendChild(indicator);
            }
            indicator.style.background = isPlaying ? '#4CAF50' : '#ccc';
            indicator.title = isPlaying ? 'Audio playing' : 'Idle';
        }

        function showNotification(message, type = 'info', durationMs = 3000) {
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                left: 20px;
                padding: 15px 20px;
                border-radius: 8px;
                font-weight: bold;
                z-index: 9999;
                animation: slideIn 0.3s ease-out;
                max-width: 300px;
                word-wrap: break-word;
                ${type === 'success' ? 'background: #4CAF50; color: white;' : ''}
                ${type === 'error' ? 'background: #f44336; color: white;' : ''}
                ${type === 'info' ? 'background: rgba(0,0,0,0.8); color: #fcb514;' : ''}
            `;

            document.body.appendChild(notification);

            if (durationMs > 0) {
                setTimeout(() => {
                    notification.remove();
                }, durationMs);
            }

            return notification;
        }
document.querySelectorAll('[data-action]').forEach((button) => {
            button.addEventListener('click', async (event) => {
                event.preventDefault();

                const buttonId = button.href;

                // Prevent multiple simultaneous clicks on same action
                if (processingButtons.has(buttonId)) {
                    showNotification('⏳ Wait for current action to complete', 'info');
                    return;
                }

                // Add visual feedback - keep button pressed while processing
                processingButtons.add(buttonId);
                button.classList.add('control-button--processing');
                const pendingNotification = showNotification('⏳ Activity in progress…', 'info', 0);

                try {
                    const response = await fetch(button.href, {
                        method: 'POST',
                        cache: 'no-store',
                        credentials: 'same-origin'
                    });

                    const data = await response.json();

                    if (data.success) {
                        // Refresh status once before releasing button state
                        await updateStatus();

                        // Show success feedback
                        showNotification('✓ ' + (data.message || 'Action completed'), 'success');
                    } else {
                        // Show error feedback
                        const errorMessage = data.details
                            ? `${data.error || 'Action failed'}: ${data.details.split('\n')[0]}`
                            : (data.error || 'Action failed');
                        showNotification('✗ ' + errorMessage, 'error');

                        // Show retry information if available
                        if (data.retry_after) {
                            setTimeout(() => {
                                showNotification(`⏳ Please wait ${data.retry_after}s`, 'info');
                            }, 500);
                        }
                    }
                } catch (error) {
                    showNotification('✗ Connection error', 'error');
                    console.error('Request failed:', error);
                } finally {
                    // Reset button state
                    processingButtons.delete(buttonId);
                    button.classList.remove('control-button--processing');
                    pendingNotification.remove();
                }
            });
        });
// Update status on page load
        updateStatus();

        // Update status every 5 seconds
        setInterval(updateStatus, 5000);
    </script>

    <style>
        .control-button.control-button--processing,
        .control-button.control-button--processing:hover,
        .control-button.control-button--processing:active {
            opacity: 0.6;
            transform: scale(0.95);
            pointer-events: none;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</body>
</html>
